# cargo-vet configuration of Skipper.
#
# Tool: cargo-vet 0.10.2 (crates.io, built on the build machine with `cargo install --locked --offline --root
# %LOCALAPPDATA%\skipper-build\tools`, never part of Skipper's own lock). `cargo xtask supply` runs it as
# `cargo vet --locked --frozen`: no network, no fetch of imported audits.
#
# Every registry package of Cargo.lock is audited (supply-chain/audits.toml), imported from the organisations below, or
# exempted here. The exemptions are the initial pin set, not audited; 7-day wait waived until version 1 (the
# owner's waiver in supply-chain/pins.toml, `seven_day_waiver`, under which `cargo xtask pin-check` skips the age checks
# of the registry packages). No audit of an exempted package is recorded, so a green `cargo vet` does not mean
# "audited": `cargo xtask supply` prints how many packages are fully audited and how many are exempted. The exemptions
# are cut, security-relevant crates first, and imports.lock is committed, before version 1 is published. Fifty of the
# exemptions are the Linux, BSD, macOS, UEFI and WASI only tree that the platform-wide lock lists: they are
# never in the Windows binary and never downloaded. The workspace's own crates are first-party and need no entry.
#
# supply-chain/imports.lock (the imported audits as they stood on the day of the fetch) is written by the networked fetch
# phase on the main PC: `skipper-cap fetch -- cargo vet` (with network, in the box), then commit the file. Without it
# `cargo vet --frozen` refuses, and `cargo xtask supply` reports that as a finding, never as success.
#
# After a change of the lock: `cargo vet regenerate exemptions` in the fetch phase (reason as above), review the diff.

[cargo-vet]
version = "0.10"

[imports.mozilla]
url = "https://hg.mozilla.org/mozilla-central/raw-file/tip/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark-studios]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

