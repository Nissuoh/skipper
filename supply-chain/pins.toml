# Supply-chain pins.
# Read by `cargo xtask pin-check` (xtask/src/pins.rs); the [conpty] table is compiled into skipper-confine.
# An empty string means "not set yet". Dates are release dates.

[toolchain]
channel = "1.99.1"
host = "x86_64-pc-windows-gnu"
released = 2026-10-15

[tool.gitleaks]
version = "8.30.1"
asset = "gitleaks_8.30.1_windows_x64.zip"
source = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip"
size = 8438883
sha256 = "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"
# exe_sha256: SHA-256 of gitleaks.exe as extracted from the asset above (2026-10-22).
exe_sha256 = "17157e2ee8b76fc8b1d8bee607a250e34b8a8023c8bc81822d4b5ee4d78fcb7c"
released = 2026-03-21

# One table per direct dependency: version (without "=") and release date from its crates.io page on the pin day.
# Pin day 2026-10-22: every row checked against crates.io (none yanked); serde, serde_json, toml, sha2 and tokio chosen
# then as the newest release at least 7 days old on 2026-10-27 (G7, G8, NB-11). A version carries its build metadata
# as cargo locks it (toml).
[crate.egui]
version = "0.37.0"
released = 2026-10-15

[crate.eframe]
version = "0.37.0"
released = 2026-10-15

[crate.egui_tiles]
